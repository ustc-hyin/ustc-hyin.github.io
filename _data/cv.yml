- title: Research Experience
  type: entries
  contents:
    - title: Johns Hopkins University
      logo: jhu.png
      rest: Visiting Student, Baltimore
      date: 07/2026 – Present
      sub: <a href="https://ccvl.jhu.edu/">CCVL Group</a> &nbsp;|&nbsp; Advisors&#58; Prof. <a href="https://www.cs.jhu.edu/~ayuille/">Alan Yuille</a> and <a href="http://www.jienengchen.com/">Jieneng Chen</a>
      items:
        - "Building an action-based evaluation of spatial intelligence: after watching a full exploration video, the model must act on its grasp of the layout in Habitat, judged by task success rather than QA accuracy."
    - title: Xiaomi
      logo: xiaomi.png
      rest: Research Intern, Beijing
      date: 01/2026 – 06/2026
      sub: MiLM Plus &nbsp;|&nbsp; Mentor&#58; Pei Fu
      items:
        - "Brought on-policy distillation from LLM post-training to temporal video grounding, replacing sparse GRPO rewards with dense token-level supervision from a teacher model and focusing training where student and teacher disagree."
        - "Led a project on scene-level spatial reasoning in which the model decides what its cognitive map should contain and when to re-check it, trained with a reward that tests whether the map alone suffices to answer."
    - title: Tencent
      logo: tencent.png
      rest: Research Intern, Beijing
      date: 09/2025 – 01/2026
      sub: Platform and Content Group (PCG) &nbsp;|&nbsp; Mentor&#58; Dian Li
      items:
        - "Reframed open-ended image captioning as answerability for reinforcement learning, co-training a questioner that probes what a caption misses and rewarding captions that let an LLM answer questions about the unseen image."
        - "Designed a decoupled reward for MLLMs that re-watch video segments while reflecting, crediting a chosen segment only if it alone suffices to answer, so that the model learns to look at the right evidence."

